name: Android Release APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Find Release APK
        id: find_apk
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shinplanner-release.jks"

          if [ ! -s "$RUNNER_TEMP/shinplanner-release.jks" ]; then
            echo "ERROR: Keystore creation failed."
            exit 1
          fi

      - name: Zipalign APK
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$APK_PATH" \
            "$RUNNER_TEMP/SHINPlanner-aligned.apk"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/shinplanner-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/SHINPlanner.apk" \
            "$RUNNER_TEMP/SHINPlanner-aligned.apk"

      - name: Verify APK Signature
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/SHINPlanner.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHINPlanner-release
          path: ${{ runner.temp }}/SHINPlanner.apk
          if-no-files-found: error
